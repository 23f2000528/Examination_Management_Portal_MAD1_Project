{% extends 'base.html' %}
{% block title %}Student Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0">My Student Profile</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="full_name" class="form-control" value="{{ student.full_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" class="form-control bg-light" value="@{{ student.username }}" readonly disabled>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Registered Email</label>
                        <input type="text" class="form-control bg-light" value="{{ student.email }}" readonly disabled>
                        <div class="form-text">System account identity. Contact admin if you need to update your registered email.</div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('student.dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
                        <button type="submit" class="btn btn-primary px-4">Update Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
