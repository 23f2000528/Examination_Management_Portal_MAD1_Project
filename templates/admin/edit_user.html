{% extends 'base.html' %}
{% block title %}Edit User{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h3 class="fw-bold mb-0">Edit User</h3>
        <p class="text-muted small mb-0">Update account details for {{ user.full_name }}</p>
    </div>
    <a href="{{ url_for('admin.manage_users') }}" class="btn btn-secondary btn-sm">← Back</a>
</div>

<div class="card shadow-sm border-0" style="max-width: 540px;">
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" name="full_name" class="form-control"
                       value="{{ user.full_name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text" name="username" class="form-control"
                       value="{{ user.username }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" name="email" class="form-control"
                       value="{{ user.email }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Role</label>
                <input type="text" class="form-control" value="{{ user.role | capitalize }}" disabled>
                <small class="text-muted">Role cannot be changed.</small>
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
