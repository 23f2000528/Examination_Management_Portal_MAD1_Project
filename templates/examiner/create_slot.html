{% extends 'base.html' %}
{% block title %}Create Slot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card mt-3">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Create Examination Slot</h5>
            </div>
            <div class="card-body">
                {% if not eligible_exams %}
                    <div class="text-center py-4">
                        <p class="text-muted">No examinations are currently open for slot creation.</p>
                        <a href="{{ url_for('examiner.dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
                    </div>
                {% else %}
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Examination</label>
                        <select name="examination_id" class="form-select" required autofocus>
                            {% for examination in eligible_exams %}
                                <option value="{{ examination.id }}">{{ examination.title }} ({{ examination.course.course_code }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Slot Date</label>
                        <input type="date" name="slot_date" class="form-control" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Start Time</label>
                            <input type="time" name="start_time" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">End Time</label>
                            <input type="time" name="end_time" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Student Capacity</label>
                        <input type="number" name="capacity" class="form-control" value="3" min="1" max="50" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('examiner.dashboard') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Create Slot</button>
                    </div>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
