{% extends 'base.html' %}
{% block title %}Add Course{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0">Create Academic Course</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course Code</label>
                        <input type="text" name="course_code" class="form-control" placeholder="e.g. CS2003" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course Name</label>
                        <input type="text" name="course_name" class="form-control" placeholder="e.g. Modern Application Development I" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Course Description</label>
                        <textarea name="description" class="form-control" rows="4" placeholder="Brief outline of syllabus and prerequisites..."></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.manage_courses') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save Course</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
