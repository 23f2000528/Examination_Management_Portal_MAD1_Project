{% extends 'base.html' %}
{% block title %}Register — Exam Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">
                    <i class="bi bi-person-plus-fill me-2 text-dark"></i>Create Account
                </h4>

                <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">

                    <div class="mb-3">
                        <label class="form-label">Register as</label>
                        <select name="role" class="form-select" id="roleSelect" required>
                            <option value="student">Student</option>
                            <option value="examiner">Examiner</option>
                        </select>
                        <div class="form-text text-muted">
                            Admin accounts cannot be created here.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control"
                               placeholder="Your full name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control"
                               placeholder="Choose a username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                               placeholder="your@email.com" required>
                    </div>

                    <!-- Extra fields shown only for examiners -->
                    <div id="examinerFields" style="display:none;">
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" name="department" class="form-control"
                                   placeholder="e.g. Computer Science">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Qualification</label>
                            <input type="text" name="qualification" class="form-control"
                                   placeholder="e.g. Ph.D. in Software Engineering">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control"
                               placeholder="Minimum 6 characters" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control"
                               placeholder="Repeat password" required>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-dark">Register</button>
                    </div>
                </form>

                <hr>
                <p class="text-center text-muted small mb-0">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    
    const roleSelect = document.getElementById('roleSelect');
    const examinerFields = document.getElementById('examinerFields');

    function toggleFields() {
        examinerFields.style.display = roleSelect.value === 'examiner' ? 'block' : 'none';
    }

    roleSelect.addEventListener('change', toggleFields);
    toggleFields();  // run once on page load
</script>
{% endblock %}
