{% extends 'base.html' %}
{% block title %}Edit Examination{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-9">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0">Edit Examination: {{ exam.title }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Examination Title</label>
                            <input type="text" name="title" class="form-control" value="{{ exam.title }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Course</label>
                            <select name="course_id" class="form-select" required>
                                {% for course in courses %}
                                    <option value="{{ course.id }}" {% if exam.course_id == course.id %}selected{% endif %}>
                                        {{ course.course_code }} - {{ course.course_name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Total Examination Marks</label>
                            <input type="number" name="total_marks" class="form-control" value="{{ exam.total_marks }}" min="1" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Status</label>
                            <select name="status" class="form-select">
                                {% for status_option in ['Draft', 'Slot Creation', 'Booking Open', 'Closed', 'Completed'] %}
                                    <option value="{{ status_option }}" {% if exam.status == status_option %}selected{% endif %}>{{ status_option }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ exam.description or '' }}</textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Examiner Slot Creation Starts</label>
                            <input type="datetime-local" name="slot_creation_start" class="form-control"
                                   value="{{ exam.slot_creation_start.strftime('%Y-%m-%dT%H:%M') if exam.slot_creation_start else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Examiner Slot Creation Ends</label>
                            <input type="datetime-local" name="slot_creation_end" class="form-control"
                                   value="{{ exam.slot_creation_end.strftime('%Y-%m-%dT%H:%M') if exam.slot_creation_end else '' }}">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Student Booking Opens</label>
                            <input type="datetime-local" name="booking_start" class="form-control"
                                   value="{{ exam.booking_start.strftime('%Y-%m-%dT%H:%M') if exam.booking_start else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Student Booking Closes</label>
                            <input type="datetime-local" name="booking_end" class="form-control"
                                   value="{{ exam.booking_end.strftime('%Y-%m-%dT%H:%M') if exam.booking_end else '' }}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Exam Date</label>
                        <input type="datetime-local" name="exam_date" class="form-control"
                               value="{{ exam.exam_date.strftime('%Y-%m-%dT%H:%M') if exam.exam_date else '' }}">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.manage_examinations') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Update Examination</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
