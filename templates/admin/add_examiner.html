{% extends 'base.html' %}
{% block title %}Add Examiner{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0">Register New Examiner</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" name="full_name" class="form-control" placeholder="e.g. Dr. K. Raman" required autofocus>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="e.g. dr_raman" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="e.g. raman@college.ac.in" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Temporary Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Academic Department</label>
                            <input type="text" name="department" class="form-control" placeholder="e.g. Computer Science">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Highest Qualification</label>
                            <input type="text" name="qualification" class="form-control" placeholder="e.g. Ph.D. in Distributed Systems">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Professional Biography</label>
                        <textarea name="bio" class="form-control" rows="3" placeholder="Summary of expertise, courses taught, industry experience..."></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.manage_users') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save & Approve Examiner</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
