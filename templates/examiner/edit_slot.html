{% extends 'base.html' %}
{% block title %}Edit Slot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card mt-3">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Edit Examination Slot</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Examination</label>
                    <input type="text" class="form-control" value="{{ slot.examination.title }} ({{ slot.examination.course.course_code }})" readonly disabled>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Slot Date</label>
                        <input type="date" name="slot_date" class="form-control" value="{{ slot.slot_date.strftime('%Y-%m-%d') }}" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Start Time</label>
                            <input type="time" name="start_time" class="form-control" value="{{ slot.start_time.strftime('%H:%M') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">End Time</label>
                            <input type="time" name="end_time" class="form-control" value="{{ slot.end_time.strftime('%H:%M') }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Student Capacity</label>
                        <input type="number" name="capacity" class="form-control" value="{{ slot.capacity }}" min="1" max="50" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('examiner.dashboard') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Slot</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
